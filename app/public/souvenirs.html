<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MANAfamily — Souvenirs</title>
  <meta name="description" content="Se connecter à MANAfamily, la maison numérique privée de votre famille.">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <span class="mac-dot" aria-hidden="true"></span>
      <nav class="nav" aria-label="Principal">
        <a href="/" class="nav-accueil" aria-label="Accueil"><svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="1" width="2" height="1" fill="currentColor"/><rect x="3" y="2" width="4" height="1" fill="currentColor"/><rect x="2" y="3" width="6" height="1" fill="currentColor"/><rect x="1" y="4" width="8" height="1" fill="currentColor"/><rect x="2" y="5" width="6" height="3" fill="currentColor"/><rect x="4" y="6" width="2" height="2" fill="#fff"/></svg></a>
        <a href="/souvenirs">Souvenirs</a>
        <a href="/famille">Famille</a>
        <a href="/agenda">Agenda</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div class="actions" style="justify-content:space-between;margin-bottom:1rem">
      <h1 style="margin:0">Souvenirs</h1>
      <div class="actions">
        <button class="btn btn-ghost" type="button" id="btn-importer">Importer des photos/vidéos/audio</button>
        <a class="btn" href="/souvenirs?ajouter=1" id="btn-ajouter">Ajouter</a>
      </div>
    </div>
    <input type="file" id="fichier-import" accept="image/*,video/*,audio/*" multiple hidden>
    <p class="meta" id="import-resultat" hidden role="status"></p>
    <section class="panel">
      <form id="filtres" class="actions">
        <input type="search" id="q" placeholder="Rechercher…" style="max-width:220px">
        <select id="kind"><option value="">Tous les types</option><option value="photo">Photos</option><option value="video">Vidéos</option><option value="text">Textes</option><option value="audio">Audio</option><option value="letter">Lettres</option><option value="recipe">Recettes</option></select>
        <select id="annee"><option value="">Toutes les années</option></select>
        <button class="btn btn-ghost" type="submit">Filtrer</button>
      </form>
    </section>
    <div id="liste"></div>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span class="footer-site">manafamily.org</span>
      <nav class="nav"><a href="/mentions-legales">Mentions légales</a></nav>
    </div>
  </footer>
  <script src="/app.js"></script>
  <script src="/js/page-souvenirs.js"></script>
</body>
</html>
